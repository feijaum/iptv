name: Audit published IPTV playback

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-published-playback
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure ffprobe is available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -1

      - name: Wait for Worker and playlist propagation
        run: sleep 45

      - name: Sync latest generated playlist
        run: git pull --rebase origin main

      - name: Test every published channel with ffprobe
        run: python scripts/audit_published.py

      - name: Repair failed publication paths
        run: python scripts/apply_playback_audit.py

      - name: Re-test repaired playlist end to end
        run: python scripts/audit_published.py

      - name: Commit playback audit
        run: |
          git add playback-audit.csv br.m3u linksoff.m3u
          if git diff --cached --quiet; then
            echo "No audit changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: audit published IPTV playback"
          git pull --rebase origin main
          git push
