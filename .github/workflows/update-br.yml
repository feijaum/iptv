name: Update Brazilian IPTV list

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_br.py"
      - ".github/workflows/update-br.yml"

permissions:
  contents: write

concurrency:
  group: update-br-playlist
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Brazilian playlist
        run: python scripts/update_br.py

      - name: Commit changes when needed
        run: |
          if git diff --quiet -- br.m3u linksoff.m3u stream-status.csv; then
            echo "No playlist changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add br.m3u linksoff.m3u stream-status.csv
          git commit -m "chore: update Brazilian IPTV playlist"
          git push
