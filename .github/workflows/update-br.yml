# force-run: 2026-09-20T11:15Z
name: Update Brazilian IPTV list

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_br.py"
      - "scripts/update_epg.py"
      - ".github/workflows/update-br.yml"

permissions:
  contents: write

concurrency:
  group: update-br-playlist
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Brazilian playlist
        run: python scripts/update_br.py

      - name: Commit changes when needed
        run: |
          if git diff --quiet -- br.m3u linksoff.m3u stream-status.csv source-status.csv candidate-status.csv relay-map.json; then
            echo "No playlist changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add br.m3u linksoff.m3u stream-status.csv source-status.csv candidate-status.csv relay-map.json
          git commit -m "chore: update Brazilian IPTV playlist"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "Main advanced while generating; replaying generated files onto latest main."
            git reset --soft HEAD~1
            git reset
            git checkout -B main origin/main
            python scripts/update_br.py
            git add br.m3u linksoff.m3u stream-status.csv source-status.csv candidate-status.csv relay-map.json
            if git diff --cached --quiet; then
              echo "No playlist changes after resync."
            else
              git commit -m "chore: update Brazilian IPTV playlist"
            fi
          fi
          git push origin HEAD:main

      - name: Ensure ffprobe is available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -1

      - name: Wait for Worker and relay map propagation
        run: sleep 20

      - name: Audit generated playlist playback
        run: python scripts/audit_published.py

      - name: Repair failed playback paths
        run: python scripts/apply_playback_audit.py

      - name: Re-test repaired playlist
        run: python scripts/audit_published.py

      - name: Remove any remaining playback failures
        run: python scripts/apply_playback_audit.py

      - name: Final playback verification
        run: python scripts/audit_published.py

      - name: Generate XMLTV EPG
        run: python scripts/update_epg.py

      - name: Commit playback-verified playlist
        run: |
          git add br.m3u linksoff.m3u playback-audit.csv guide.xml.gz epg-status.csv
          if git diff --cached --quiet; then
            echo "No playback-audit changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish playback-verified IPTV playlist"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "Main advanced before final publish; preserving verified artifacts on latest main."
            mkdir -p /tmp/iptv-final
            cp br.m3u linksoff.m3u playback-audit.csv guide.xml.gz epg-status.csv /tmp/iptv-final/
            git checkout -B main origin/main
            cp /tmp/iptv-final/br.m3u /tmp/iptv-final/linksoff.m3u /tmp/iptv-final/playback-audit.csv /tmp/iptv-final/guide.xml.gz /tmp/iptv-final/epg-status.csv .
            git add br.m3u linksoff.m3u playback-audit.csv guide.xml.gz epg-status.csv
            if git diff --cached --quiet; then
              echo "No final changes after resync."
            else
              git commit -m "chore: publish playback-verified IPTV playlist"
            fi
          fi
          git push origin HEAD:main

